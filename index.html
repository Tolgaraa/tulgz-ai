<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#050b18"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TULGZ AI"><title>TULGZ AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 30%,#112e48,#050b18 70%);color:#e4faff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh}main{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);display:flex;flex-direction:column;min-height:100dvh}header{display:flex;justify-content:space-between;align-items:center;padding:25px 0 8px;letter-spacing:3px;color:#5feaff;font-size:12px}header strong{font-size:18px}.status{color:#71ffca;letter-spacing:1px;font-size:11px}.hero{text-align:center;padding:25px 0 20px}.orb{width:190px;height:190px;border:2px solid #34dfff;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;box-shadow:0 0 28px #00d9ff55,inset 0 0 32px #00d9ff44;animation:pulse 3s ease-in-out infinite;position:relative}.orb:before{content:'';position:absolute;inset:14px;border:1px dashed #5beaffaa;border-radius:50%;animation:spin 18s linear infinite}.orb:after{content:'';width:82px;height:82px;border-radius:50%;background:radial-gradient(circle,#d7ffff,#00b7f7 40%,#00456d 75%);box-shadow:0 0 40px #00d9ff}.orb.talking{animation:pulse .65s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{box-shadow:0 0 55px #00d9ff99,inset 0 0 40px #00d9ff66;transform:scale(1.025)}}h1{margin:0;font-size:28px;letter-spacing:6px}small{color:#7cb8c9}.panel{background:#09192ad9;border:1px solid #1c5d78;border-radius:18px;padding:15px;flex:1;min-height:200px;display:flex;flex-direction:column}.panel-title{color:#57dfff;font-size:11px;letter-spacing:2px;margin-bottom:12px}.messages{flex:1;overflow-y:auto;max-height:32dvh;min-height:110px}.msg{padding:10px 12px;margin:8px 0;border-radius:12px;background:#113249;line-height:1.4;font-size:14px}.msg.user{background:#164c61;margin-left:24px}.controls{display:flex;gap:8px;margin-top:14px}input{flex:1;min-width:0;background:#07111f;border:1px solid #28667e;color:white;border-radius:12px;padding:13px;font-size:16px}button{background:#08b8dc;color:#001522;border:0;border-radius:12px;padding:12px 15px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.footer{text-align:center;color:#568b9f;font-size:10px;letter-spacing:2px;padding:16px 0 20px}
</style></head>
<body><main><header><strong>TULGZ AI</strong><span class="status">● SYSTEM ONLINE</span></header><section class="hero"><div class="orb" id="orb"></div><h1>JARVIS</h1><small>PERSONAL ASSISTANT · PROTOTYPE 0.1</small></section><section class="panel"><div class="panel-title">◈ KOMMUNIKATION</div><div class="messages" id="messages" aria-live="polite"><div class="msg">Willkommen zurück, Sir. TULGZ AI ist bereit. Was kann ich für Sie tun?</div></div><div class="controls"><input id="question" aria-label="Nachricht" placeholder="Fragen Sie JARVIS …"><button id="send">➤</button><button id="speak" aria-label="Sprachausgabe">🔊</button></div></section><div class="footer">TULGZ SYSTEMS · PRIVATE PROTOTYPE</div></main>
<script>
const messages=document.getElementById('messages'),question=document.getElementById('question'),orb=document.getElementById('orb');let last='Willkommen zurück, Sir. TULGZ AI ist bereit.';
function say(t){if(!('speechSynthesis' in window))return alert('Sprachausgabe wird hier nicht unterstützt.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.95;u.onstart=()=>orb.classList.add('talking');u.onend=u.onerror=()=>orb.classList.remove('talking');speechSynthesis.speak(u)}
function add(t,who){let d=document.createElement('div');d.className='msg '+who;d.textContent=t;messages.append(d);messages.scrollTop=messages.scrollHeight}
function reply(q){let s=q.toLowerCase();if(/hallo|hey|moin/.test(s))return 'Guten Tag, Sir. Alle Prototyp-Systeme sind betriebsbereit.';if(/wer bist|dein name/.test(s))return 'Ich bin JARVIS, die Benutzeroberfläche von TULGZ AI. Meine echte KI-Anbindung folgt in einer späteren Version.';if(/uhrzeit|wie spät/.test(s))return 'Es ist '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr, Sir.';if(/datum|welcher tag/.test(s))return 'Heute ist '+new Date().toLocaleDateString('de-DE',{dateStyle:'full'})+'.';if(/stream|obs|pc/.test(s))return 'Die sichere PC-Steuerung ist geplant, aber noch nicht verbunden, Sir.';return 'Nachricht empfangen, Sir. Ich arbeite aktuell mit Demo-Antworten. Die echte KI-Funktion entwickeln wir als Nächstes.'}
function send(){let q=question.value.trim();if(!q)return;add(q,'user');question.value='';last=reply(q);add(last,'assistant')}
document.getElementById('send').onclick=send;question.addEventListener('keydown',e=>{if(e.key==='Enter')send()});document.getElementById('speak').onclick=()=>say(last);
</script></body></html>
