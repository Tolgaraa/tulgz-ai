
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TULGZ AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 30%,#112e48,#050b18 70%);color:#e4faff;font-family:-apple-system,sans-serif;min-height:100dvh}
main{max-width:560px;margin:auto;padding:25px 18px;display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;justify-content:space-between;align-items:center;color:#5feaff;font-size:12px;letter-spacing:2px}
header strong{font-size:19px}
.status{color:#71ffca}
.hero{text-align:center;padding:35px 0 25px}
.orb{width:185px;height:185px;border:2px solid #34dfff;border-radius:50%;margin:0 auto 25px;display:grid;place-items:center;box-shadow:0 0 30px #00d9ff55,inset 0 0 30px #00d9ff44;animation:pulse 3s infinite;position:relative}
.orb:before{content:"";position:absolute;inset:14px;border:1px dashed #5beaff;border-radius:50%;animation:spin 18s linear infinite}
.orb:after{content:"";width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#d7ffff,#00b7f7 40%,#00456d 75%);box-shadow:0 0 40px #00d9ff}
.orb.talking{animation:pulse .65s infinite}
.orb.listening{border-color:#74ffc9}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{box-shadow:0 0 55px #00d9ff99;transform:scale(1.025)}}
h1{font-size:28px;letter-spacing:6px;margin:0}
small{color:#7cb8c9}
.panel{background:#09192add;border:1px solid #1c5d78;border-radius:18px;padding:15px;flex:1;display:flex;flex-direction:column}
.panel-title{color:#57dfff;font-size:11px;letter-spacing:2px}
.messages{flex:1;overflow-y:auto;max-height:35dvh;min-height:120px}
.msg{padding:11px;margin:9px 0;border-radius:12px;background:#113249;font-size:14px;line-height:1.5}
.msg.user{background:#164c61;margin-left:25px}
.controls{display:flex;gap:8px;margin-top:14px}
input{flex:1;min-width:0;background:#07111f;border:1px solid #28667e;color:white;border-radius:12px;padding:12px;font-size:16px}
button{background:#08b8dc;color:#001522;border:0;border-radius:12px;padding:12px;font-weight:bold}
button:disabled{opacity:.4}
.voicebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:11px}
.voicebar button{background:#173c51;color:#d7faff;border:1px solid #2b8298;padding:10px}
.hint{font-size:11px;color:#85b9c8;margin-top:10px}
footer{text-align:center;color:#568b9f;font-size:10px;letter-spacing:2px;padding:20px}
</style>
</head>
<body>
<main>
<header>
<strong>TULGZ AI</strong>
<span class="status">● SYSTEM ONLINE</span>
</header>

<section class="hero">
<div class="orb" id="orb"></div>
<h1>JARVIS</h1>
<small>PERSONAL ASSISTANT · VERSION 0.2</small>
</section>

<section class="panel">
<div class="panel-title">◈ KOMMUNIKATION</div>
<div class="messages" id="messages">
<div class="msg">Willkommen zurück, Sir. TULGZ AI ist bereit. Was kann ich für Sie tun?</div>
</div>
<div class="controls">
<input id="question" placeholder="Fragen Sie JARVIS …">
<button id="send">➤</button>
<button id="mic">🎙️</button>
</div>
<div class="voicebar">
<span id="voiceStatus">STIMME BEREIT</span>
<button id="toggleVoice">🔊 Stimme AN</button>
<button id="repeat">↻</button>
</div>
<div class="hint" id="hint">Spracherkennung auf iOS wird getestet.</div>
</section>
<footer>TULGZ SYSTEMS · PRIVATE PROTOTYPE</footer>
</main>

<script>
const messages=document.getElementById('messages');
const question=document.getElementById('question');
const orb=document.getElementById('orb');
const statusEl=document.getElementById('voiceStatus');
const hint=document.getElementById('hint');
const synth=window.speechSynthesis;
let last='Willkommen zurück, Sir. TULGZ AI ist bereit.';
let voiceOn=true;

function say(t){
 if(!voiceOn)return;
 if(!synth){
  statusEl.textContent='SPRACHE NICHT VERFÜGBAR';
  return;
 }
 synth.cancel();
 const u=new SpeechSynthesisUtterance(t);
 u.lang='de-DE';
 u.rate=.92;
 u.pitch=.86;
 const voices=synth.getVoices();
 const german=voices.find(v=>v.lang==='de-DE')||voices.find(v=>v.lang.startsWith('de'));
 if(german)u.voice=german;
 u.onstart=()=>{
  orb.classList.add('talking');
  statusEl.textContent='JARVIS SPRICHT';
 };
 u.onend=()=>{
  orb.classList.remove('talking');
  statusEl.textContent='SYSTEM BEREIT';
 };
 u.onerror=()=>{
  orb.classList.remove('talking');
  statusEl.textContent='AUDIO NICHT VERFÜGBAR';
 };
 synth.speak(u);
}

function add(t,who){
 const d=document.createElement('div');
 d.className='msg '+who;
 d.textContent=t;
 messages.append(d);
 messages.scrollTop=messages.scrollHeight;
}

function reply(q){
 const s=q.toLowerCase();
 if(/hallo|hey|moin/.test(s))
  return 'Guten Tag, Sir. TULGZ AI ist bereit.';
 if(/wer bist|dein name/.test(s))
  return 'Ich bin JARVIS, Ihr persönlicher Assistent. Momentan nutze ich noch Demo-Antworten.';
 if(/uhrzeit|wie spät/.test(s))
  return 'Es ist '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr, Sir.';
 if(/datum|welcher tag/.test(s))
  return 'Heute ist '+new Date().toLocaleDateString('de-DE',{dateStyle:'full'})+'.';
 if(/stream|obs|pc/.test(s))
  return 'Die sichere PC-Steuerung ist geplant, aber noch nicht verbunden, Sir.';
 return 'Nachricht empfangen, Sir. Meine echte KI-Anbindung folgt später. Aktuell arbeite ich mit vorgegebenen Antworten.';
}

function send(q=question.value){
 q=q.trim();
 if(!q)return;
 add(q,'user');
 question.value='';
 last=reply(q);
 add(last,'assistant');
 say(last);
}

document.getElementById('send').onclick=()=>send();
question.addEventListener('keydown',e=>{
 if(e.key==='Enter')send();
});

document.getElementById('toggleVoice').onclick=()=>{
 voiceOn=!voiceOn;
 document.getElementById('toggleVoice').textContent=voiceOn?'🔊 Stimme AN':'🔇 Stimme AUS';
 if(!voiceOn){
  synth?.cancel();
  orb.classList.remove('talking');
 }
 statusEl.textContent=voiceOn?'STIMME AKTIV':'STIMME STUMM';
 if(voiceOn)say('Sprachausgabe aktiviert, Sir.');
};

document.getElementById('repeat').onclick=()=>say(last);

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=document.getElementById('mic');

if(!SR){
 hint.textContent='Spracherkennung hier nicht unterstützt. Nutze die iPhone-Tastatur mit Diktierfunktion.';
 mic.disabled=true;
}else{
 const recognition=new SR();
 recognition.lang='de-DE';
 recognition.interimResults=false;
 let listening=false;
 recognition.onresult=e=>{
  const spoken=e.results[0][0].transcript;
  hint.textContent='Erkannt: '+spoken;
  send(spoken);
 };
 recognition.onstart=()=>{
  listening=true;
  orb.classList.add('listening');
  statusEl.textContent='ICH HÖRE ZU';
  mic.textContent='⏹️';
 };
 recognition.onend=()=>{
  listening=false;
  orb.classList.remove('listening');
  mic.textContent='🎙️';
 };
 recognition.onerror=e=>{
  hint.textContent='Mikrofonfehler: '+e.error;
 };
 mic.onclick=()=>{
  try{
   if(listening)recognition.stop();
   else{
    synth?.cancel();
    recognition.start();
   }
  }catch(e){
   hint.textContent='Spracherkennung konnte nicht gestartet werden.';
  }
 };
}
</script>
</body>
</html>
